name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check (renegade)
    runs-on: ubuntu-latest

    # The pnpm workspace root lives under Data-Model-Home/ (Replit scaffold
    # artifact). All install/build steps run from there.
    defaults:
      run:
        working-directory: Data-Model-Home

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Data-Model-Home/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check renegade (tsc --noEmit)
        run: pnpm --filter @workspace/renegade run typecheck
